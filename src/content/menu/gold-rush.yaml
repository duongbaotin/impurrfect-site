# ---- Required fields ----

name: "Gold Rush"
price: "VND 129k"              # always use "VND ...k" format
description: "Rich whiskey pairs seamlessly with smooth honey syrup and a bright squeeze of lime, offering a clean, balanced classic that can be lengthened with a crisp splash of club soda."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

