# ---- Required fields ----

name: "Old Fashioned"
price: "VND 129k"              # always use "VND ...k" format
description: "Rich bourbon takes center stage in this absolute classic, lightly sweetened and seasoned with aromatic bitters, then finished with the bright, essential oils of a fresh orange twist."
category: "Cocktails" # must match a category exactly (see below)

