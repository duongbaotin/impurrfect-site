# ---- Required fields ----

name: "Fitzgerald"
price: "VND 149k"              # always use "VND ...k" format
description: "Botanical gin gets a vibrant, sweet-tart lift from fresh lemon, while a pinch of salt makes the flavors pop against a warm anchor of aromatic bitters."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 14                     # position in the list; lower = first (default: 0 / sorts first)
