# ---- Required fields ----

name: "Eastside"
price: "VND 129k"              # always use "VND ...k" format
description: "Crisp gin and fresh, muddled cucumber and mint create an exceptionally cooling baseline, sharpened by a generous pour of lime juice and simple syrup, with the option to lengthen into a refreshing fizz with a splash of club soda."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 13                     # position in the list; lower = first (default: 0 / sorts first)
subcategory: "Gin-based" # groups drinks within a category
tags: ["Refreshing", "Herbal", "Botanical"]    # flavor tags shown on the menu
featured: false               # adds a ★ Bartender's Pick badge
# image: "/cocktail-placeholder.svg"  # path to an image in the public/ folder
available: true             # set to false to show "Currently unavailable"