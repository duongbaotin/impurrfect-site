# ---- Required fields ----

name: "Strawberry Rumble"
price: "VND 109k"              # always use "VND ...k" format
description: "Muddled, sugar-glazed strawberries steal the spotlight here, their rich berry sweetness folding into a bright splash of lime that keeps the white rum base remarkably light and lively."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 20                     # position in the list; lower = first (default: 0 / sorts first)
subcategory: "Rum-based" # groups drinks within a category
tags: ["Fruity", "Sweet", "Tart"]    # flavor tags shown on the menu
featured: true               # adds a ★ Bartender's Pick badge
image: "/highball-glass.svg"  # path to an image in the public/ folder
available: true             # set to false to show "Currently unavailable"