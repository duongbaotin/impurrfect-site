# ---- Required fields ----

name: "Peach, Orange & Lemongrass Mixed Beer"
price: "VND 79k"              # always use "VND ...k" format
description: "Sweet peach, bright orange, and lemongrass softening a crisp, bitter lager."
category: "Mixed Beers" # must match a category exactly (see below)

# ---- Optional fields ----

order: 37                     # position in the list; lower = first (default: 0 / sorts first)
# subcategory: "" # groups drinks within a category
tags: ["Fruity", "Citrus", "Herbal"]    # flavor tags shown on the menu
featured: false               # adds a ★ Bartender's Pick badge
image: "/tulip-glass.svg"  # lookup key resolved by MenuItem.astro imageSrcMap
available: true             # set to false to show "Currently unavailable"