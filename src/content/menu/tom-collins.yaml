# ---- Required fields ----

name: "Tom Collins"
price: "VND 129k"              # always use "VND ...k" format
description: "A tall, breezy glass of crisp gin, sweet-tart lime, and bubbly club soda."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 10                     # position in the list; lower = first (default: 0 / sorts first)
subcategory: "Gin-based" # groups drinks within a category
tags: ["Refreshing", "Citrus", "Botanical"]    # flavor tags shown on the menu
featured: false               # adds a ★ Bartender's Pick badge
image: "/collins-glass.svg"  # path to an image in the public/ folder
available: true             # set to false to show "Currently unavailable"