# ---- Required fields ----

name: "Tamarind Mixed Beer"
price: "VND 79k"              # always use "VND ...k" format
description: "Sticky sweet-sour tamarind and light lager with a fiery chili-shrimp salt rim."
category: "Mixed Beers" # must match a category exactly (see below)

# ---- Optional fields ----

order: 33                     # position in the list; lower = first (default: 0 / sorts first)
