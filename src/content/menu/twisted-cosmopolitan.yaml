# ---- Required fields ----

name: "Twisted Cosmopolitan"
price: "VND 129k"              # always use "VND ...k" format
description: "House-made strawberry syrup replaces the traditional cranberry here, wrapping a velvety berry sweetness around the crisp vodka base while sharp lime and orange liqueur snap the finish back into focus."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 25                     # position in the list; lower = first (default: 0 / sorts first)
subcategory: "Vodka-based" # groups drinks within a category
tags: ["Fruity", "Sweet", "Citrus"]    # flavor tags shown on the menu
featured: true               # adds a ★ Bartender's Pick badge
# image: "/cocktail-placeholder.svg"  # path to an image in the public/ folder
available: true             # set to false to show "Currently unavailable"