# ---- Required fields ----

name: "Mexican Mule"
price: "VND 149k"              # always use "VND ...k" format
description: "Earthy tequila blanco locking paws with sharp lime, spicy ginger, and bubbly soda."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 32                     # position in the list; lower = first (default: 0 / sorts first)
