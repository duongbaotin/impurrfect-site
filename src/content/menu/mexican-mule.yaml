tags: ["Spiced", "Citrus", "Earthy"]    # flavor tags shown on the menu
featured: false               # adds a ★ Bartender's Pick badge
image: "/collins-glass.svg"  # lookup key resolved by MenuItem.astro imageSrcMap
available: true             # set to false to show "Currently unavailable"