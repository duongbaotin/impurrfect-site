# ---- Required fields ----

name: "Gin & Tonic"
price: "VND 109k"              # always use "VND ...k" format
description: "Crisp London dry gin meets the bittersweet effervescence of premium tonic water, brought together with a gentle stir and finished with a bright squeeze of fresh lime."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 9                     # position in the list; lower = first (default: 0 / sorts first)
subcategory: "Gin-based" # groups drinks within a category
tags: ["Refreshing", "Bitter", "Botanical"]    # flavor tags shown on the menu
featured: false               # adds a ★ Bartender's Pick badge
# image: "/cocktail-placeholder.svg"  # path to an image in the public/ folder
available: true             # set to false to show "Currently unavailable"