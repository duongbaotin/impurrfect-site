# ---- Required fields ----

name: "Dark 'N' Stormy"
price: "VND 109k"              # always use "VND ...k" format
description: "Moody dark rum floats like a tempest over a sharp, fiery layer of ginger beer, creating a visually striking highball that drinks crisp and bites back gently."
category: "Cocktails" # must match a category exactly (see below)

# ---- Optional fields ----

order: 22                     # position in the list; lower = first (default: 0 / sorts first)
